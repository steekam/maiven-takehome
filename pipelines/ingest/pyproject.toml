[project]
name = "maiven-federal-register-ingest"
version = "0.1.0"
description = "Resumable Federal Register document ingester for Maiven"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
federal-register-ingest = "maiven_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maiven_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
