services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maiven-takehome
      POSTGRES_USER: maiven
      POSTGRES_PASSWORD: maiven-dev
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maiven -d maiven-takehome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
