name: maiven-review

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maiven-takehome
      POSTGRES_USER: maiven
      POSTGRES_PASSWORD: maiven-dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maiven -d maiven-takehome"]
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://maiven:maiven-dev@postgres:5432/maiven-takehome
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command:
      ["pnpm", "--filter", "@maiven/web", "dev", "--hostname", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://maiven:maiven-dev@postgres:5432/maiven-takehome
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      DATABASE_URL: postgresql://maiven:maiven-dev@postgres:5432/maiven-takehome
    volumes:
      - ingest-data:/app/data
      - ingest-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/telemetry/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./ops/telemetry/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./ops/telemetry/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/telemetry/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.2
    volumes:
      - ./ops/telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - loki
      - prometheus
      - tempo

volumes:
  postgres-data:
  ingest-data:
  ingest-logs:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
